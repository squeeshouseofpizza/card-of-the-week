<!-- Fact or Fiction: The Game embed for a Fourthwall Custom HTML section. Turn on full width in the section settings. -->
<div class="shop-fof" style="width:100%;padding:40px 0 64px;background:linear-gradient(to bottom,#1c1d21 0,rgba(28,29,33,0) 56px,rgba(28,29,33,0) calc(100% - 56px),#1c1d21 100%),radial-gradient(ellipse 70% 40% at 50% 0%,rgba(214,163,74,.14),rgba(214,163,74,0) 70%),#17120c;">
  <div style="max-width:600px;margin:0 auto;">
    <iframe id="fof-frame" src="https://squeeshouseofpizza.github.io/card-of-the-week/fof/" title="Fact or Fiction: The Game"
      loading="lazy" scrolling="no" allowtransparency="true"
      style="width:100%;height:1400px;border:0;display:block;background:transparent;color-scheme:normal;"></iframe>
  </div>
</div>
<script>
(function(){
  var f = document.getElementById('fof-frame');
  window.addEventListener('message', function(e){
    if (e.origin !== 'https://squeeshouseofpizza.github.io') return;
    if (e.data && e.data.fofGame && e.data.height) f.style.height = Math.max(800, e.data.height + 24) + 'px';
  });
})();
</script>
