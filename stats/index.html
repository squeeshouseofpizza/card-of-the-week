<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Game stats · S.H.O.P.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500&display=swap">
<style>
/* Private stats for the S.H.O.P. games. The numbers come from the game server and only show for Discord accounts on
   its admin list; this page itself holds no data. */
:root{
  --ground:#17120c; --panel:#211a11; --line:rgba(214,163,74,.3); --gold:#d6a34a; --gold-lite:#e6b862;
  --cream:#efe6d2; --muted:#a99873; --bar:#8a6a2e;
  --display:"Cinzel",Georgia,serif; --body:"EB Garamond",Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:26px;margin:0;color:var(--gold-lite)}
h2{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;font-weight:500}
h3{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:15px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .l{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tile .n{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
#out{display:flex;flex-direction:column;gap:18px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15.5px}
th{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(214,163,74,.12);vertical-align:top}
th:first-child,td:first-child,td.l,th.l{text-align:left}
td.s{text-align:left;min-width:280px;max-width:520px}
.bar{display:inline-block;height:10px;background:var(--bar);border-radius:2px;vertical-align:middle;margin-right:6px}
.btn{background:#5865f2;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-size:16px;cursor:pointer}
.link{background:none;border:0;color:var(--gold);text-decoration:underline;font:inherit;font-size:15px;cursor:pointer;padding:0}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
code{font-family:var(--mono);background:#2a2116;padding:2px 6px;border-radius:4px}
.fact{color:#9cc98f}.fiction{color:#e08a6e}
/* Small charts: one hue; the most common value is the brighter bar. Hover a bar for its exact count. */
.hist{display:flex;align-items:flex-end;gap:2px;height:46px;margin:6px 0 2px}
.hist i{display:block;width:16px;min-height:2px;background:var(--bar);border-radius:3px 3px 0 0}
.hist i.top{background:var(--gold-lite)}
.histx{display:flex;gap:2px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.histx span{width:16px;text-align:center}
.split{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.split i{display:block;height:10px;border-radius:2px}
.split i.r{background:var(--gold-lite)}.split i.w{background:#7a6545}
td.v{text-align:left;white-space:normal;min-width:130px}
td.w{text-align:left;white-space:normal;min-width:90px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:13px;margin:1px 2px;white-space:nowrap}
.tag.good{border-color:#6f8f5f;color:#b7d3a6}.tag.flag{border-color:#9a6a4a;color:#e7b08f}.tag.muted{color:var(--muted)}
.stats-line{margin:0 0 6px;font-size:15px}
details{margin-top:10px}
details.earlier>summary{color:var(--muted)}summary{cursor:pointer;color:var(--gold-lite);font-size:15.5px}
td.l,th.l{white-space:nowrap}
button.sort{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;white-space:nowrap}
button.sort:hover,button.sort.on{color:var(--gold-lite)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>S.H.O.P. game stats</h1><div id="auth" class="muted"></div></div>
  <div class="msg" id="msg">Loading…</div>
  <div id="out" hidden></div>
</div>
<script>
(function(){
  const API='https://card-of-the-week.squeeshouseofpizza.workers.dev';
  const $=id=>document.getElementById(id);
  const MEM=new Map();
  const store={get(k){try{const v=localStorage.getItem(k);if(v){try{return JSON.parse(v)}catch(e){return v}}}catch(e){}return MEM.get(k)||''},set(k,v){MEM.set(k,v);try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){MEM.delete(k);try{localStorage.removeItem(k)}catch(e){}}};
  const token=()=>store.get('shopweekly.token');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num=n=>n==null?'–':Number(n).toLocaleString();
  const TOP=['Olive','Basil','Garlic','Mushroom','Onion','Pepperoni','Tomato','Green pepper','Mozzarella','Signature chili','Pizza'];
  const fmtPts=n=>n<0?'−'+(-n):String(n);
  const bar=(v,max,w=120)=>`<span class="bar" style="width:${max?Math.max(2,Math.round(v/max*w)):0}px"></span>`;

  function signIn(){
    const nonce=Array.from(crypto.getRandomValues(new Uint8Array(18)),x=>x.toString(16).padStart(2,'0')).join('');
    const w=window.open(API+'/auth/login?nonce='+nonce,'cotw-login','width=520,height=780');
    if(!w){$('msg').textContent='Allow pop-ups for this page to sign in with Discord.';return}
    let n=0;const iv=setInterval(async()=>{
      if(++n>90){clearInterval(iv);return}
      try{const r=await(await fetch(API+'/auth/claim?nonce='+nonce)).json();if(r.token){clearInterval(iv);store.set('shopweekly.token',r.token);load()}}catch(e){}
    },2000);
  }
  function askSignIn(text){
    $('out').hidden=true;$('auth').textContent='';
    $('msg').innerHTML=`<p style="margin:0 0 10px">${esc(text)}</p><button class="btn" id="si" type="button">Sign in with Discord</button>`;
    $('si').onclick=signIn;
  }

  async function load(){
    if(!token())return askSignIn('This page is for the S.H.O.P. crew. Sign in with Discord to see the numbers.');
    let r,j;
    try{r=await fetch(API+'/admin/stats',{headers:{Authorization:'Bearer '+token()}});j=await r.json()}catch(e){$('msg').textContent='The game server didn’t answer. Try again in a minute.';return}
    if(r.status===401){store.del('shopweekly.token');return askSignIn('Your sign-in expired. Sign in with Discord again.')}
    if(r.status===403){$('out').hidden=true;$('msg').innerHTML=`Signed in as ${esc(j.you.name)}, but this account isn’t on the stats list yet. Send this Discord ID to Claude to be added: <code>${esc(j.you.id)}</code> <button class="link" id="so" type="button">Sign out</button>`;$('so').onclick=signOut;return}
    if(!r.ok){$('msg').textContent='Something went wrong loading the stats.';return}
    $('auth').innerHTML='<button class="link" id="so" type="button">Sign out</button>';$('so').onclick=signOut;
    $('msg').textContent='As of '+new Date(j.at).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' Eastern. Refresh for the latest.';
    render(j);
  }
  async function signOut(){try{await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token()}})}catch(e){}store.del('shopweekly.token');load()}

  function render(j){
    const P=j.pizza,G=j.gtc.weeks,F=j.fof.weeks,A=P.anon;
    const tiles=[['Discord accounts',j.accounts],['Pizza Drop games',P.games],['Guess the Card games',G.reduce((s,w)=>s+w.players,0)],['Fact or Fiction piles',F.reduce((s,w)=>s+w.piles,0)]];
    let h=`<div class="tiles">${tiles.map(([l,n])=>`<div class="tile"><div class="l">${l}</div><div class="n">${num(n)}</div></div>`).join('')}</div>`;

    // Coming back: the number to watch for growth (weekly cohorts, as in Roblox's creator analytics, kept to one row per week).
    const R=j.returning||{gtc:[],fof:[],pizza:[]};
    const retTable=(rows,label)=>{const r=rows.slice().reverse().slice(0,8);if(!r.length)return`<p class="muted" style="margin:0">${label}: starts with week 1.</p>`;
      const mx=Math.max(1,...r.map(x=>x.players));
      return `<h3>${label}</h3><table><thead><tr><th class="l">Week</th><th class="l">Players</th><th>Came back</th><th>New</th></tr></thead><tbody>${r.map(x=>{const ret=x.came_back||0,nw=x.players-ret;
        return `<tr><td>${x.week<1?'Before launch':'Week '+x.week}</td><td class="l"><span class="split" title="${ret} came back, ${nw} new">${ret?`<i class="r" style="width:${Math.max(2,Math.round(ret/mx*140))}px"></i>`:''}${nw?`<i class="w" style="width:${Math.max(2,Math.round(nw/mx*140))}px"></i>`:''}</span>${num(x.players)}</td><td>${num(ret)}</td><td>${num(nw)}</td></tr>`}).join('')}</tbody></table>`};
    h+=`<section><h2>Coming back</h2><p class="muted stats-line">Players each week who had played an earlier week (bright) versus first-timers (dark). Counted per browser, or per Discord account once signed in; the practice weeks don't count.</p>
      <div class="scroll">${retTable(R.gtc,'Guess the Card')}${retTable(R.fof,'Fact or Fiction')}${retTable(R.pizza,'Pizza Drop')}</div></section>`;

    const maxG=Math.max(1,...P.days.map(d=>d.games)),allTop=P.biggest.reduce((s,b)=>s+b.games,0)||1,maxB=Math.max(1,...P.biggest.map(b=>b.games));
    h+=`<section><h2>Pizza Drop</h2><div class="scroll"><table><thead><tr><th class="l">Day</th><th class="l">Games</th><th>Avg score</th><th>Best</th><th>Avg minutes</th></tr></thead><tbody>
      ${P.days.slice().reverse().map(d=>`<tr><td>${d.day}</td><td class="l">${bar(d.games,maxG)}${num(d.games)}</td><td>${num(d.avgScore)}</td><td>${num(d.best)}</td><td>${d.avgMinutes}</td></tr>`).join('')||'<tr><td colspan="5" class="l muted">No games yet.</td></tr>'}</tbody></table></div>
      <h3>Biggest topping made per game</h3><div class="scroll"><table><thead><tr><th class="l">Topping</th><th class="l">Games</th><th>Share</th></tr></thead><tbody>
      ${P.biggest.map(b=>`<tr><td>${b.top<0?'No merges':TOP[b.top]}</td><td class="l">${bar(b.games,maxB)}${num(b.games)}</td><td>${Math.round(100*b.games/allTop)}%</td></tr>`).join('')}</tbody></table></div>
      <h3>Best scores (signed in)</h3><div class="scroll"><table><thead><tr><th class="l">Player</th><th>Best</th><th>Weeks played</th></tr></thead><tbody>
      ${P.top.map(t=>`<tr><td>${esc(t.name)}</td><td>${num(t.best)}</td><td>${t.weeks}</td></tr>`).join('')||'<tr><td colspan="3" class="l muted">No signed-in scores yet.</td></tr>'}</tbody></table></div>
      <h3>Games per player</h3><div class="scroll">${pzTable('signed',P.players||[],'No signed-in games yet.')}</div>
      ${A&&A.browsers?`<details data-game="pizza-anon" data-week="0"><summary>Not signed in: ${plural(A.browsers,'browser')}, ${plural(A.games,'game')} · best ${num(A.best)} · ${plural(A.pizzas,'pizza')} · last played ${when(A.last)}</summary><div class="det muted">Loading…</div></details>`:''}
      <p class="muted" style="margin:10px 0 0">Click a column heading to sort; ties go to most games, then most recently played. Counts start Oct 29, 2026${P.untracked?` (${num(P.untracked)} earlier games weren’t tagged and only show in the daily totals)`:''}. Not signed in means one browser, so one person on a phone and a laptop counts twice; when a browser signs in, its games move to the account.</p></section>`;

    const wk=w=>w===-1?'Practice card':w<-1?'Test '+(-w-1):'Week '+w;
    // A small bar chart; the most common value is highlighted (like Wordle's guess chart).
    const hist=(pairs)=>{if(!pairs.some(p=>p[1]))return'';const mx=Math.max(1,...pairs.map(p=>p[1]));return `<div class="hist">${pairs.map(([k,c])=>`<i class="${c===mx&&c>0?'top':''}" style="height:${c?Math.max(3,Math.round(c/mx*44)):0}px" title="${esc(k)}: ${c}"></i>`).join('')}</div><div class="histx">${pairs.map(([k])=>`<span>${esc(k)}</span>`).join('')}</div>`};
    // Verdict per Fact or Fiction card, from test-question guidelines: under 30% or over 90% right needs attention,
    // about 75% is ideal for a two-answer question; "I'm sure" pays only above 2 in 3; discrimination 0.25+ is good.
    const verdict=c=>{const n=c.answers;if(n<5)return'<span class="tag muted">Too few answers yet</span>';
      const r=c.ok/n,t=[];t.push(r>.9?'<span class="tag flag">Too easy</span>':r<.3?'<span class="tag flag">Too hard</span>':'<span class="tag good">Good range</span>');
      if(c.sureN>=3&&c.sureOk/c.sureN<2/3)t.push('<span class="tag flag">Overconfident</span>');
      // When nearly everyone is right (or wrong) there's nothing to separate, so no separation tag.
      if(c.disc!=null&&r<=.9&&r>=.1)t.push(c.disc<0?'<span class="tag flag">Weaker players did better</span>':(c.disc>=.25?'<span class="tag good">Separates players':'<span class="tag flag">Doesn’t separate players')+` (best half ${c.topRight}%, worst half ${c.bottomRight}%)</span>`);
      if(n<10)t.push('<span class="tag muted">Early read</span>');return t.join('')};
    // The two most recent weeks are shown; older ones fold under "Earlier weeks". Nothing is deleted.
    const recent=(list,f)=>{const s=list.slice().sort((a,b)=>b.week-a.week);if(!s.length)return'';const top=s.slice(0,2).map(f).join(''),rest=s.slice(2);
      return top+(rest.length?`<details class="earlier"><summary>Earlier weeks (${rest.length})</summary>${rest.map(f).join('')}</details>`:'')};
    const pc=v=>v==null?'–':v+'%';
    h+=`<section><h2>Guess the Card</h2><div class="scroll"><table><thead><tr><th class="l">Week</th><th>Players</th><th>Solved</th><th>Out of guesses</th><th>Stopped partway</th><th>Avg guesses (solved)</th><th>Signed in</th></tr></thead><tbody>
      ${G.slice().sort((a,b)=>b.week-a.week).map(w=>`<tr><td>${wk(w.week)}</td><td>${num(w.players)}</td><td>${num(w.solved)}</td><td>${num(w.outOfGuesses)}</td><td>${num(w.stopped)}</td><td>${w.avgGuesses??'–'}</td><td>${num(w.signedIn)}</td></tr>`).join('')||'<tr><td colspan="7" class="l muted">No games yet.</td></tr>'}</tbody></table></div>
      <p class="muted" style="margin:8px 0 0">Out of guesses: used all six and missed. Stopped partway: made at least one guess, then left. Opening the page without guessing isn't recorded. Players are counted per browser.</p>
      ${recent(G,w=>{const past=G.filter(x=>x.week>=1&&x.week<w.week&&x.avgGuesses!=null),pa=past.length?Math.round(10*past.reduce((s,x)=>s+x.avgGuesses,0)/past.length)/10:null;
        return `<h3>${wk(w.week)}</h3><p class="stats-line">${w.avgGuesses!=null?'Average '+w.avgGuesses+' guesses to solve'+(pa!=null?` (earlier weeks: ${pa})`:''):'Nobody has solved it yet'}. Hints reached: artist ${w.hints.artist}, flavor text ${w.hints.flavor}, art ${w.hints.art}.</p>
        ${hist([...w.dist.map((c,i)=>[String(i+1),c]),['X',w.outOfGuesses]])}<p class="muted" style="margin:2px 0 6px;font-size:13px">Solved in 1 to 6 guesses; X = out of guesses. ${num(w.stopped)} stopped partway (not shown).</p>
        <p class="muted stats-line">Top first guesses: ${w.firsts.map(f=>esc(f[0])+' ('+f[1]+')').join(', ')||'–'}.</p>
        <details data-game="gtc" data-week="${w.week}"><summary>Each player's guesses</summary><div class="det muted">Loading…</div></details>`})}</section>`;

    h+=`<section><h2>Fact or Fiction: The Game</h2>${recent(F,w=>{
      const st=Object.entries(w.stopped||{}),pts=(w.points||[]).slice().sort((a,b)=>a[0]-b[0]);
      let spread='';if(pts.length){const all=[];pts.forEach(([p,c])=>{for(let k=0;k<c;k++)all.push(p)});const med=all.length%2?all[(all.length-1)/2]:(all[all.length/2-1]+all[all.length/2])/2;
        const lo=pts[0][0],hi=pts[pts.length-1][0],m=new Map(pts),bins=[];for(let v=lo;v<=hi;v++)bins.push([fmtPts(v),m.get(v)||0]);
        spread=`<p class="stats-line">Finished piles scored ${fmtPts(lo)} to ${fmtPts(hi)} points: average ${w.avgPoints}, median ${fmtPts(med)}.</p>${hist(bins)}<p class="muted" style="margin:2px 0 8px;font-size:13px">Points per finished pile.</p>`}
      return `<h3>${esc(w.label)} · ${num(w.piles)} started · ${num(w.finished)} finished · ${num(w.signedIn)} signed in</h3>
      ${spread}${st.length?`<p class="muted stats-line">Unfinished piles stopped at: ${st.map(([c,n])=>'card '+c+' ('+n+')').join(', ')}.</p>`:''}
      <div class="scroll"><table><thead><tr><th class="l">#</th><th class="l">Statement</th><th class="l">Answer</th><th class="l">Got it right</th><th class="l">What people picked</th><th class="l">“I’m sure”</th><th class="l">Verdict</th></tr></thead><tbody>
      ${w.cards.map(c=>{const n=c.answers,fact=c.a==='fact'?c.ok:n-c.ok,mx=Math.max(1,...w.cards.map(x=>x.answers));
        return `<tr><td>${c.i}</td><td class="s">${esc(c.s)}</td><td class="l ${c.a}">${c.a==='fact'?'Fact':'Fiction'}</td>
        <td class="l">${n?`<span class="split" title="${c.ok} right, ${n-c.ok} wrong">${c.ok?`<i class="r" style="width:${Math.round(c.ok/mx*70)}px"></i>`:''}${n-c.ok?`<i class="w" style="width:${Math.round((n-c.ok)/mx*70)}px"></i>`:''}</span>${c.ok} of ${n} (${Math.round(100*c.ok/n)}%)`:'–'}</td>
        <td class="w">${n?`${fact} Fact · ${n-fact} Fiction`:'–'}</td>
        <td class="w">${c.sureN?`${c.sureN} of ${n} · ${c.sureOk} right (${Math.round(100*c.sureOk/c.sureN)}%)`:n?'None':'–'}</td>
        <td class="v">${n?verdict(c):''}</td></tr>`}).join('')}</tbody></table></div>
      <details data-game="fof" data-week="${w.week}" data-cards="${w.cards.length}"><summary>${esc(w.label)}: each player's answers</summary><div class="det muted">Loading…</div></details>`})||'<p class="muted">No piles played yet.</p>'}
      <p class="muted" style="margin:10px 0 0">Bars: bright = right, dark = wrong. Verdicts follow standard test-question guidelines: under 30% or over 90% right needs a look, and about 75% is ideal for a two-answer question. Overconfident: people who chose “I’m sure” were right less than 2 times in 3, the break-even for that button. From 20 finished piles, each card in the good range also shows whether the players who scored best overall were more likely to get it right than the players who scored worst (Separates players) or not (Doesn’t separate players). That's a different question from how many got it right. Early read: fewer than 10 answers.</p></section>`;

    const maxS=Math.max(1,...j.signups.map(s=>s.n));
    h+=`<section><h2>New Discord sign-ins</h2><div class="scroll"><table><thead><tr><th class="l">Day</th><th class="l">New accounts</th></tr></thead><tbody>
      ${j.signups.slice().reverse().map(s=>`<tr><td>${s.day}</td><td class="l">${bar(s.n,maxS)}${num(s.n)}</td></tr>`).join('')}</tbody></table></div></section>`;
    $('out').innerHTML=h;$('out').hidden=false;
    // Sortable Pizza Drop player tables (one handler, set rather than added, so reloading after sign-in doesn't stack them).
    $('out').onclick=e=>{const b=e.target.closest('button[data-sort]');if(!b)return;const t=b.closest('table[data-pz]'),id=t.dataset.pz,s=PZ_SORT[id],k=b.dataset.sort;
      if(s.key===k)s.dir=-s.dir;else{s.key=k;s.dir=k==='name'?1:-1}
      t.outerHTML=pzTable(id,PZ_ROWS[id],t.dataset.empty)};
    // Each week's per-player detail loads the first time it's opened.
    $('out').querySelectorAll('details[data-game]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.loaded){d.dataset.loaded='1';detail(d)}}));
  }
  const mark=x=>x?`<span class="${x.ok?'fact':'fiction'}">${x.ok?'✓':'✕'}</span> ${x.pick==='fact'?'Fact':'Fiction'}${x.sure?' · sure':''}`:'<span class="muted">–</span>';
  const who=p=>esc(p.name)+(p.signedIn?'':' <span class="muted">(not signed in)</span>');
  const when=t=>t?new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'–';
  const dur=ms=>{const s=Math.round(ms/1000);return s<60?s+'s':s<3600?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'};
  const plural=(n,w)=>num(n)+' '+w+(n===1?'':'s');
  // Pizza Drop games per player. Default order matches the server: most games, then most recently played, then name.
  // Any other column sorts first by that column, then falls back to the default order.
  const PZ_COLS=[['name','Player'],['games','Games'],['best','Best'],['avg','Avg score'],['pizzas','Pizzas'],['last','Last played']];
  const PZ_SORT={signed:{key:'games',dir:-1},anon:{key:'games',dir:-1}},PZ_ROWS={};
  const pzBase=(a,b)=>b.games-a.games||b.last-a.last||String(a.name).localeCompare(String(b.name));
  function pzTable(id,rows,empty){
    PZ_ROWS[id]=rows;const s=PZ_SORT[id];
    const cmp=(a,b)=>(s.key==='name'?String(a.name).localeCompare(String(b.name)):(a[s.key]||0)-(b[s.key]||0))*s.dir||pzBase(a,b);
    const head=PZ_COLS.map(([k,l],i)=>{const on=s.key===k;return `<th${i?'':' class="l"'}${on?` aria-sort="${s.dir<0?'descending':'ascending'}"`:''}><button type="button" class="sort${on?' on':''}" data-sort="${k}">${l}${on?(s.dir<0?' ▼':' ▲'):''}</button></th>`}).join('');
    const body=rows.slice().sort(cmp).map(p=>`<tr><td>${esc(p.name)}</td><td>${num(p.games)}</td><td>${num(p.best)}</td><td>${num(p.avg)}</td><td>${num(p.pizzas)}</td><td>${when(p.last)}</td></tr>`).join('')||`<tr><td colspan="6" class="l muted">${esc(empty||'Nobody yet.')}</td></tr>`;
    return `<table data-pz="${id}" data-empty="${esc(empty)}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }
  async function detail(d){
    const box=d.querySelector('.det'),game=d.dataset.game;
    let j;try{const r=await fetch(API+'/admin/detail?game='+game+'&week='+d.dataset.week,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw 0;j=await r.json()}
    catch(e){box.textContent='Couldn’t load this. Close and open it again.';delete d.dataset.loaded;return}
    box.className='det scroll';
    if(!j.players.length){box.innerHTML='<p class="muted">Nobody yet.</p>';return}
    // Only the table scrolls sideways on a phone, so the note above it stays put.
    if(game==='pizza-anon'){box.className='det';box.innerHTML=`<p class="muted" style="margin:6px 0">Each browser that played without signing in, labelled by the start of its random id, so a label always means the same browser.</p><div class="scroll">${pzTable('anon',j.players,'')}</div>`;return}
    if(game==='gtc')box.innerHTML=`<p class="muted" style="margin:6px 0">Newest first. Played is when the first guess went in (Eastern); Took is first guess to last.</p><table><thead><tr><th class="l">Played</th><th class="l">Player</th><th class="l">Result</th><th>Took</th><th class="l">Guesses in order</th></tr></thead><tbody>
      ${j.players.map(p=>`<tr><td class="l">${when(p.started)}</td><td class="l">${who(p)}</td><td class="l">${p.won?'Solved in '+p.guesses.length:p.done?'Out of guesses':'Stopped after '+p.guesses.length}</td><td>${p.ms==null?'–':dur(p.ms)}</td><td class="s">${p.guesses.map(esc).join(' → ')}</td></tr>`).join('')}</tbody></table>`;
    else{const n=+d.dataset.cards;box.innerHTML=`<p class="muted" style="margin:6px 0">Newest first. Played is when the first card was answered (Eastern).</p><table><thead><tr><th class="l">Played</th><th class="l">Player</th><th>Points</th>${Array.from({length:n},(_,i)=>`<th class="l">Card ${i+1}</th>`).join('')}</tr></thead><tbody>
      ${j.players.map(p=>`<tr><td class="l">${when(p.started)}</td><td class="l">${who(p)}${p.finished?'':' <span class="muted">(unfinished)</span>'}</td><td>${fmtPts(p.points)}</td>${p.answers.map(x=>`<td class="l">${mark(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  }
  load();
})();
</script>
</body>
</html>
