<!-- Guess the Card embed for a Fourthwall Custom HTML section. Turn on full width in the section settings. -->
<div class="shop-gtc" style="width:100%;padding:40px 0 64px;background:#1c1d21;">
  <div style="max-width:820px;margin:0 auto;">
    <iframe id="gtc-frame" src="https://squeeshouseofpizza.github.io/card-of-the-week/" title="Guess the Card"
      loading="lazy" scrolling="no" allowtransparency="true"
      style="width:100%;height:1400px;border:0;display:block;background:transparent;color-scheme:normal;"></iframe>
  </div>
</div>
<script>
(function(){
  var f = document.getElementById('gtc-frame');
  window.addEventListener('message', function(e){
    if (e.origin !== 'https://squeeshouseofpizza.github.io') return;
    if (e.data && e.data.cardOfTheWeek && e.data.height) f.style.height = Math.max(700, e.data.height + 24) + 'px';
  });
})();
</script>
