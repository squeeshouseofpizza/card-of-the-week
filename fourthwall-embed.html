<!-- Card of the Week embed for a Fourthwall Custom HTML section. Turn on full width in the section settings. -->
<div class="cotw-embed" style="max-width:820px;margin:0 auto;">
  <iframe id="cotw-frame" src="https://squeeshouseofpizza.github.io/card-of-the-week/" title="Card of the Week"
    loading="lazy" scrolling="no" allowtransparency="true"
    style="width:100%;height:1400px;border:0;display:block;background:transparent;"></iframe>
</div>
<script>
(function(){
  var f = document.getElementById('cotw-frame');
  window.addEventListener('message', function(e){
    if (e.origin !== 'https://squeeshouseofpizza.github.io') return;
    if (e.data && e.data.cardOfTheWeek && e.data.height) f.style.height = Math.max(700, e.data.height + 24) + 'px';
  });
})();
</script>
