name: probe-flavor
on: workflow_dispatch
permissions:
  contents: write
jobs:
  flavor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download sets
        run: |
          mkdir -p sets
          for s in LEA LEB 2ED ARN ATQ 3ED LEG DRK FEM 4ED ICE CHR HML ALL MIR VIS 5ED WTH TMP STH EXO USG ULG 6ED UDS MMQ NEM PCY INV PLS 7ED APC ODY TOR JUD ONS LGN SCG POR PO2 PTK S99; do
            curl -sSf --retry 3 -o sets/$s.json https://mtgjson.com/api/v5/$s.json || echo "missing $s"
          done
      - name: Flavor check
        run: python3 build/probe_flavor.py > flavor.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan flavor-output; git rm -rq --cached . || true
          git add -f flavor.txt; git commit -qm flavor; git push -f origin flavor-output
