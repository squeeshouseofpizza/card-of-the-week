name: Build data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download MTGJSON sets
        run: |
          mkdir -p mtgjson
          for s in 4ED ICE CHR HML ALL MIR VIS 5ED WTH TMP STH EXO USG ULG 6ED UDS MMQ NEM PCY INV PLS 7ED APC ODY TOR JUD ONS LGN SCG; do
            curl -sSf --retry 3 -o mtgjson/$s.json https://mtgjson.com/api/v5/$s.json
          done
      - name: Build card list
        run: python3 build/build_cards.py mtgjson data/cards.json
      - name: Count MTGO Challenge decklists
        run: python3 build/build_pool_counts.py build/pool_counts.csv
      - name: Commit
        run: |
          git config user.name "card-of-the-week-bot"
          git config user.email "card-of-the-week-bot@users.noreply.github.com"
          git add data/cards.json build/pool_counts.csv
          git diff --cached --quiet || git commit -m "Rebuild card data and decklist counts"
          git push
