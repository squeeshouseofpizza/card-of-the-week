name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e +o pipefail
          exec > probe.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          for u in "https://www.mtgo.com/decklists/2026/09" "https://www.mtgo.com/decklists/2026/9" "https://www.mtgo.com/decklists?year=2026&month=09" "https://www.mtgo.com/decklists/2025/12"; do
            curl -sSL -A "$UA" -o p.html -w "$u -> %{http_code} %{size_download} %{url_effective}\n" "$u"
            echo "  premodern links: $(grep -o '/decklist/premodern-[a-z0-9-]*' p.html | sort -u | wc -l)  any links: $(grep -o '/decklist/[a-z0-9-]*' p.html | sort -u | wc -l)"
            grep -o '/decklist/[a-z0-9-]*' p.html | sort -u | head -3
            grep -o 'decklists/20[0-9][0-9]/[0-9]*[^"]*' p.html | sort -u | head -5
          done
          echo "--- skipped page check"
          curl -sSL -A "$UA" -o s.html -w "%{http_code} %{url_effective}\n" "https://www.mtgo.com/decklist/premodern-challenge-16-2026-10-0212855762"
          grep -o 'window.MTGO.decklists.data = .\{0,120\}' s.html
      - name: Save
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output; git rm -rq --cached . || true
          git add probe.txt; git commit -qm probe; git push -f origin probe-output
