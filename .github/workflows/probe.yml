name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e +o pipefail
          exec > probe.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sSL -A "$UA" -o feed.xml -w "buzzsprout rss %{http_code} %{size_download}\n" https://feeds.buzzsprout.com/2626886.rss
          echo "items: $(grep -c '<item>' feed.xml)  transcript tags: $(grep -c 'podcast:transcript' feed.xml)"
          grep -o '<podcast:transcript[^>]*>' feed.xml | head -3
          grep -o '<title>[^<]*</title>' feed.xml | head -6
          t=$(grep -o 'podcast:transcript url="[^"]*"' feed.xml | head -1 | cut -d'"' -f2); echo "first transcript: $t"
          [ -n "$t" ] && curl -sSL -A "$UA" "$t" | head -c 700; echo
          echo "--- youtube channel page"
          curl -sSL -A "$UA" -o yt.html -w "yt %{http_code} %{size_download}\n" "https://www.youtube.com/@SqueesHouseofPizza/videos"
          cid=$(grep -o '"channelId":"UC[^"]*"' yt.html | head -1 | cut -d'"' -f4); echo "channel id: $cid"
          curl -sSL -A "$UA" -o ytf.xml -w "yt feed %{http_code} %{size_download}\n" "https://www.youtube.com/feeds/videos.xml?channel_id=$cid"
          echo "feed entries: $(grep -c '<entry>' ytf.xml)"; grep -o '<title>[^<]*</title>' ytf.xml | head -5
          grep -o '<media:description>[^<]\{0,400\}' ytf.xml | head -2
          echo "--- links in yt descriptions"; grep -o 'https\?://[^ <"]*' ytf.xml | grep -v youtube | sed 's#\(https\?://[^/]*\).*#\1#' | sort | uniq -c | sort -rn | head -10
      - name: Save
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output; git rm -rq --cached . || true
          git add probe.txt; git commit -qm probe; git push -f origin probe-output
