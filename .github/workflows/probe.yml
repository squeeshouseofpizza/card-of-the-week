name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 build/probe_search.py "Fact or Fiction" "Replenish" "Psychatog" "Parallax Wave" "Opalescence" "Stifle" "Phyrexian Dreadnought" "Goblin Lackey" "Survival of the Fittest" "Oath of Druids" "Stasis" "Terravore" "Armageddon" "Enchantress's Presence" "Argothian Enchantress" "Gush" "Swords to Plowshares" "Mishra's Factory" > probe.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output; git rm -rq --cached . || true
          git add -f probe.txt; git commit -qm probe; git push -f origin probe-output
