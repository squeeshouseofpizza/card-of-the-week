name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e +o pipefail
          exec > probe.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sSL -A "$UA" -o p.html "https://www.mtgo.com/decklists/2026/09"
          echo "--- scripts"; grep -o '<script[^>]*src="[^"]*"' p.html | head -20
          echo "--- api-ish strings"; grep -o '[a-zA-Z0-9_./:-]*\(api\|json\|decklist[a-z]*\)[a-zA-Z0-9_./?=&{}:-]*' p.html | sort -u | head -40
          echo "--- window.MTGO"; grep -o 'window.MTGO[^;]\{0,200\}' p.html | head -10
          for js in $(grep -o '<script[^>]*src="[^"]*"' p.html | grep -o 'src="[^"]*' | cut -c6- | grep -i -v "google\|gtm\|onetrust\|cookie" | head -8); do
            case "$js" in http*) u="$js";; //*) u="https:$js";; *) u="https://www.mtgo.com$js";; esac
            curl -sSL -A "$UA" -o j.js "$u"; echo "=== $u $(wc -c < j.js)"
            grep -o '.\{0,80\}decklist.\{0,120\}' j.js | grep -i "fetch\|url\|api\|ajax\|get(\|\.json\|/[0-9]" | head -8
          done
      - name: Save
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-output; git rm -rq --cached . || true
          git add probe.txt; git commit -qm probe; git push -f origin probe-output
