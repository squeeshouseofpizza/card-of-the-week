name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probes
        run: |
          set +e +o pipefail
          exec > probe.txt 2>&1
          for u in /decklist/premodern-challenge-32-2026-10-0112855462 /decklist/premodern-challenge-16-2026-10-2712857011; do
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Accept: text/html" -o d.html -w "$u %{http_code} %{size_download} %{url_effective}\n" "https://www.mtgo.com$u"
            grep -o 'window.MTGO.decklists.data = .\{0,300\}' d.html | head -c 400; echo
            grep -o '"card_name":"[^"]*"' d.html | sort | uniq -c | sort -rn | head -8
            grep -o '"[a-z_]*":' d.html | sort | uniq -c | sort -rn | head -40
          done
      - name: Save output
        if: always()
        run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-output; git rm -rq --cached . || true
          git add probe.txt; git commit -qm "probe output"; git push -f origin probe-output
